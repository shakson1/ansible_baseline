---
# Configure network settings

- name: Configure NTP/Chrony (Debian)
  block:
    - name: Configure systemd-timesyncd
      template:
        src: timesyncd.conf.j2
        dest: "{{ baseline_ntp_config }}"
        owner: root
        group: root
        mode: '0644'

    - name: Start and enable systemd-timesyncd
      service:
        name: systemd-timesyncd
        state: started
        enabled: yes

  when: ansible_os_family == "Debian"

- name: Configure NTP/Chrony (RedHat)
  block:
    - name: Configure chrony
      template:
        src: chrony.conf.j2
        dest: "{{ baseline_ntp_config }}"
        owner: root
        group: root
        mode: '0644'

    - name: Start and enable chronyd
      service:
        name: chronyd
        state: started
        enabled: yes

  when: ansible_os_family == "RedHat"

- name: Configure network interfaces
  template:
    src: network.j2
    dest: /etc/sysctl.d/99-network.conf
    owner: root
    group: root
    mode: '0644'

- name: Apply network configuration
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop: "{{ baseline_network_optimizations }}"

- name: Configure DNS resolvers
  block:
    - name: Backup existing resolv.conf
      copy:
        src: /etc/resolv.conf
        dest: /etc/resolv.conf.backup
        remote_src: yes
      when: ansible_check_mode is not defined
      failed_when: false

    - name: Configure DNS servers
      lineinfile:
        path: /etc/resolv.conf
        regexp: "^nameserver {{ item }}"
        line: "nameserver {{ item }}"
        state: present
      loop: "{{ baseline_dns_servers }}"
      when: baseline_dns_servers is defined

  when: baseline_dns_servers is defined and baseline_dns_servers | length > 0

- name: Configure hosts file entries
  lineinfile:
    path: /etc/hosts
    regexp: "^{{ item.ip }}\\s+{{ item.hostname }}"
    line: "{{ item.ip }}\t{{ item.hostname }}{{ ' ' + item.aliases | join(' ') if item.aliases is defined else '' }}"
    state: present
  loop: "{{ baseline_hosts_entries | default([]) }}"
  when: baseline_hosts_entries is defined and baseline_hosts_entries | length > 0 