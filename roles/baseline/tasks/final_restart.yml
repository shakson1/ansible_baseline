---
# Final system restart if needed

- name: Check if restart is required
  block:
    - name: Check reboot flag file (Debian)
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      when: ansible_os_family == "Debian"

    - name: Check if restart is required (RedHat)
      command: needs-restarting -r
      register: reboot_required_cmd
      failed_when: false
      changed_when: false
      when: ansible_os_family == "RedHat"

    - name: Display reboot requirement status
      debug:
        msg: "{{ 'System reboot is required' if (reboot_required_file.stat.exists | default(false)) or (reboot_required_cmd.rc | default(0) != 0) else 'No reboot required' }}"

- name: Reboot system if required (Debian)
  reboot:
    msg: "Reboot initiated by Ansible for baseline configuration"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 10
    post_reboot_delay: 30
    test_command: whoami
  when: 
    - ansible_os_family == "Debian"
    - reboot_required_file.stat.exists | default(false)
    - baseline_auto_reboot | default(false)
  tags:
    - restart
    - reboot

- name: Reboot system if required (RedHat)
  reboot:
    msg: "Reboot initiated by Ansible for baseline configuration"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 10
    post_reboot_delay: 30
    test_command: whoami
  when: 
    - ansible_os_family == "RedHat"
    - reboot_required_cmd.rc | default(0) != 0
    - baseline_auto_reboot | default(false)
  tags:
    - restart
    - reboot

- name: Warn about required reboot
  debug:
    msg: |
      ========================================
      WARNING: System reboot is required!
      ========================================
      Please reboot the system manually or set
      baseline_auto_reboot: true to enable
      automatic rebooting.
      ========================================
  when:
    - (reboot_required_file.stat.exists | default(false)) or (reboot_required_cmd.rc | default(0) != 0)
    - not (baseline_auto_reboot | default(false)) 