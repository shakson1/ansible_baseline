---
# Final system restart if needed

- name: Check if restart is required
  stat:
    path: /var/run/reboot-required
  register: reboot_required_file
  when: ansible_os_family == "Debian"

- name: Check if restart is required (RedHat)
  command: needs-restarting -r
  register: reboot_required_cmd
  failed_when: false
  changed_when: false
  when: ansible_os_family == "RedHat"

- name: Reboot system if required (Debian)
  reboot:
    msg: "Reboot initiated by Ansible for baseline configuration"
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: whoami
  when: 
    - ansible_os_family == "Debian"
    - reboot_required_file.stat.exists

- name: Reboot system if required (RedHat)
  reboot:
    msg: "Reboot initiated by Ansible for baseline configuration"
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: whoami
  when: 
    - ansible_os_family == "RedHat"
    - reboot_required_cmd.rc != 0 