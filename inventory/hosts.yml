---
all:
  children:
    debian_servers:
      hosts:
        ubuntu-server-1:
          ansible_host: 192.168.1.10
          ansible_user: ubuntu
          baseline_hostname: ubuntu-server-1
        debian-server-1:
          ansible_host: 192.168.1.11
          ansible_user: debian
          baseline_hostname: debian-server-1
      vars:
        baseline_timezone: America/New_York
        baseline_ssh_port: 2222
        
    redhat_servers:
      hosts:
        centos-server-1:
          ansible_host: 192.168.1.20
          ansible_user: centos
          baseline_hostname: centos-server-1
        rocky-server-1:
          ansible_host: 192.168.1.21
          ansible_user: rocky
          baseline_hostname: rocky-server-1
      vars:
        baseline_timezone: UTC
        baseline_ssh_port: 22
        
    production:
      children:
        debian_servers:
        redhat_servers:
      vars:
        baseline_install_monitoring: true
        baseline_configure_firewall: true
        baseline_configure_ssh: true
        baseline_configure_logging: true
        baseline_configure_network: true
        baseline_update_system: true
        
    staging:
      hosts:
        staging-server:
          ansible_host: 192.168.1.100
          ansible_user: admin
          baseline_hostname: staging-server
      vars:
        baseline_install_monitoring: false
        baseline_configure_firewall: false
        baseline_configure_ssh: true
        baseline_configure_logging: true
        baseline_configure_network: false
        baseline_update_system: true
        
  vars:
    # Global variables
    ansible_python_interpreter: /usr/bin/python3
    baseline_admin_user: admin
    baseline_ssh_permit_root_login: false
    baseline_ssh_password_authentication: false
    baseline_ssh_pubkey_authentication: true
    baseline_firewall_allowed_ports:
      - 22    # SSH
      - 80    # HTTP
      - 443   # HTTPS 